<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Info</title>

  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1f2933;
      --subtext-color: #6b7280;
      --accent-color: #16a34a; 
      --border-color: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;      
        --card-bg: #020617;       
        --text-color: #e5e7eb;
        --subtext-color: #9ca3af;
        --accent-color: #22c55e;  
        --border-color: #1f2937;
      }
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
    }

    .card {
      max-width: 420px;
      margin: 40px auto;
      background: var(--card-bg);
      padding: 26px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
  .nxp {

      margin: 40px auto;
      background: var(--card-bg);
      padding: 26px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid var(--accent-color);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--subtext-color);
      margin-bottom: 22px;
    }

    .info {
      text-align: left;
      margin-bottom: 14px;
      font-size: 15px;
      display: flex;
      gap: 6px;
    }

    .label {
      font-weight: 600;
      min-width: 80px;
    }

    a {
      color: var(--accent-color);
      text-decoration: none;
      word-break: break-all;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 22px;
      font-size: 13px;
      color: var(--subtext-color);
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <img src="desktop.jpeg" alt="Profile Photo" class="profile-img">

    <h1>Luke Andrei T. De Leon</h1>
    <div class="subtitle">BS Information Technology Student</div>

    <div class="info">
      <span class="label">📧 Email:</span>
      <a href="mailto:yourname@email.com">yourname@email.com</a>
    </div>

    <div class="info">
      <span class="label">📱 Phone:</span>
      +63 9XX XXX XXXX
    </div>

    <div class="info">
      <span class="label">🏫 School:</span>
      Bulacan State University – Hagonoy Campus
    </div>

    <div class="info">
      <span class="label">💻 GitHub:</span>
      <a href="https://github.com/yourusername">github.com/yourusername</a>
    </div>

  </div>
  <div class="nxp">
  <div class="Project">
    <h3>Projects:</h3> 
      <li>waww</li>
      <li>asdas</li>
      <li>fawef</li>
    </div>
  </div>
</body>
</html>
